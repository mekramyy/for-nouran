<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Nouran 💗</title>
<style>
:root{--bg1:#ffe3ea;--bg2:#e88aa0;--ink:#7a1d3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#ffe3ea;--bg2:#e88aa0}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:16px}
.bubble{background:#fff;border-radius:18px;padding:10px 16px;font-weight:700;box-shadow:0 4px 14px #0002;max-width:90%}
.card{background:#fff9;border-radius:24px;padding:18px 28px;font-size:90px;line-height:1;box-shadow:0 8px 24px #0002}
h1{margin:0;font-size:clamp(22px,5vw,34px)}
.btns{display:flex;gap:16px;align-items:center;justify-content:center;min-height:120px}
button{border:0;color:#fff;font-weight:700;border-radius:999px;padding:12px 28px;font-size:18px;cursor:pointer;box-shadow:0 4px 12px #0003}
#yes{background:#0f9d6b;transition:transform .2s}
#no{background:#d32f2f;position:relative;transition:left .15s,top .15s}
#win{display:none}
.hearts span{position:fixed;top:-40px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style></head>
<body><div id="app">
<div id="main">
<h1 id="q"></h1>
<div class="bubble" id="say" style="margin:16px auto;display:inline-block">Pick yessssss</div>
<div><div class="card" id="face"></div></div>
<div class="btns"><button id="yes">Yes</button><button id="no">No</button></div>
</div>
<div id="win"><div class="card" id="wface"></div><h1 id="msg" style="margin-top:20px;font-size:clamp(28px,7vw,48px)"></h1></div>
</div>
<script>
// ✏️ Edit these four lines, or use a link like ?to=Nouran&from=Ekramy&q=...&msg=...
const P=new URLSearchParams(location.search);
const TO=P.get('to')||'NOURANNN', FROM=P.get('from')||'Ekramy';
const Q=P.get('q')||'Momken trg3yyyyy', MSG=P.get('msg')||'I love youuuuu';
document.getElementById('q').textContent=TO+', '+Q;
document.getElementById('msg').textContent=MSG+' ❤️ — '+FROM;
const lines=['TO2 TO2222','Mot2akda??','Fakry tanyyyyy','pleaseeee','3shann khatryyy','3shan khatr 2otnaaa','Ya Nouran  ekhtary Yes','Ana asefffffff'];
const moods=['sad','cry','sad','pleading','cry','sad','pleading','sad'];
function cat(m){
 const eye=m==='love'?'<path d="M32 50q7-12 14 0M64 50q7-12 14 0" fill="none" stroke="#1c2b36" stroke-width="4" stroke-linecap="round"/>':'<circle cx="39" cy="48" r="'+(m==='pleading'?7:5)+'" fill="#1c2b36"/><circle cx="71" cy="48" r="'+(m==='pleading'?7:5)+'" fill="#1c2b36"/><circle cx="41" cy="46" r="2" fill="#fff"/><circle cx="73" cy="46" r="2" fill="#fff"/>';
 const mouth=m==='love'||m==='happy'?'<path d="M44 60q11 14 22 0z" fill="#e8607a" stroke="#1c2b36" stroke-width="3" stroke-linejoin="round"/>':'<path d="M46 70q9-10 18 0" fill="none" stroke="#1c2b36" stroke-width="3.5" stroke-linecap="round"/>';
 const tear=m==='cry'?'<path d="M36 58q-4 8 0 11q4-3 0-11M74 58q-4 8 0 11q4-3 0-11" fill="#8fd8ff"/>':'';
 return '<svg viewBox="0 0 110 100" width="120" height="110"><polygon points="16,40 20,6 44,24" fill="#5bc8e8" stroke="#2b6f86" stroke-width="3" stroke-linejoin="round"/><polygon points="94,40 90,6 66,24" fill="#5bc8e8" stroke="#2b6f86" stroke-width="3" stroke-linejoin="round"/><ellipse cx="55" cy="58" rx="44" ry="34" fill="#5bc8e8" stroke="#2b6f86" stroke-width="3"/><ellipse cx="55" cy="86" rx="22" ry="7" fill="#fff"/><circle cx="26" cy="62" r="6" fill="#ff9fb3" opacity=".7"/><circle cx="84" cy="62" r="6" fill="#ff9fb3" opacity=".7"/>'+eye+mouth+tear+'</svg>';
}
let n=0;const yes=document.getElementById('yes'),no=document.getElementById('no'),say=document.getElementById('say'),face=document.getElementById('face');face.innerHTML=cat('happy');
function dodge(){
  no.style.position='fixed';
  const w=innerWidth-no.offsetWidth-20,h=innerHeight-no.offsetHeight-20;
  no.style.left=Math.max(10,Math.random()*w)+'px';
  no.style.top=Math.max(10,Math.random()*h)+'px';
  n++;say.textContent=lines[(n-1)%lines.length];face.innerHTML=cat(moods[n%moods.length]);
  yes.style.transform='scale('+Math.min(1+n*0.25,4)+')';
  yes.style.margin=(n*6)+'px';
}
['mouseenter','touchstart','click'].forEach(e=>no.addEventListener(e,ev=>{ev.preventDefault();dodge()},{passive:false}));
yes.onclick=()=>{
  document.getElementById('main').style.display='none';
  document.getElementById('win').style.display='block';document.getElementById('wface').innerHTML=cat('love');no.remove();
  try{fetch('https://ntfy.sh/nouran-yes-k7q4x9m2',{method:'POST',body:TO+' said YES! (after pressing No '+n+' times)'})}catch(e){}
  setInterval(()=>{const s=document.createElement('span');s.textContent=['💗','💖','💕','🌸'][Math.random()*4|0];
    s.style.left=Math.random()*100+'vw';s.style.fontSize=(18+Math.random()*28)+'px';s.style.animationDuration=(3+Math.random()*3)+'s';
    document.body.appendChild(s).parentNode;document.querySelector('.hearts')||0;setTimeout(()=>s.remove(),6500)},120);
};
document.head.insertAdjacentHTML('beforeend','<style>body>span{position:fixed;top:-40px;animation:fall linear forwards;pointer-events:none}</style>');
</script></body></html>
